[package]
name = "codex-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = ["embedded"]
# Preserve embedded startup and legacy core APIs for existing TUI/exec consumers.
embedded = [
    "codex-app-server-daemon/lifecycle",
    "dep:codex-app-server",
    "dep:codex-arg0",
    "dep:codex-config",
    "dep:codex-core",
    "dep:codex-exec-server",
    "dep:codex-feedback",
    "dep:codex-protocol",
    "dep:toml",
]

[dependencies]
codex-app-server-daemon = { path = "../app-server-daemon", default-features = false }
codex-app-server = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true, optional = true }
codex-config = { workspace = true, optional = true }
codex-core = { workspace = true, optional = true }
codex-exec-server = { workspace = true, optional = true }
codex-feedback = { workspace = true, optional = true }
codex-protocol = { workspace = true, optional = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "io-std", "io-util"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
