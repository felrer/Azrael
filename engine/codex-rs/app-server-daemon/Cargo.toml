[package]
name = "codex-app-server-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_app_server_daemon"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = ["lifecycle"]
# Managed lifecycle remains the default; private registration is always available.
lifecycle = [
    "dep:sha2",
    "dep:data-encoding",
    "dep:anyhow",
    "dep:codex-app-server-protocol",
    "dep:codex-app-server-transport",
    "dep:codex-http-client",
    "dep:codex-install-context",
    "dep:codex-utils-home-dir",
    "dep:libc",
    "dep:serde",
    "dep:semver",
    "dep:blake3",
    "dep:tempfile",
    "dep:tracing",
    "dep:windows-sys",
]

[dependencies]
sha2 = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true, optional = true }
codex-app-server-transport = { workspace = true, optional = true }
codex-http-client = { workspace = true, optional = true }
codex-install-context = { workspace = true, optional = true }
codex-utils-home-dir = { workspace = true, optional = true }
codex-uds = { workspace = true }
futures = { workspace = true }
libc = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tempfile = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
