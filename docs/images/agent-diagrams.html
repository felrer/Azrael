<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azrael · Agent diagrams</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 40px 24px; color: #202622; background: #f4f5f4; font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
main { max-width: 1120px; margin: auto; }
header { margin-bottom: 36px; }
h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.7px; }
header p { margin: 0; color: #68716b; font-size: 16px; }
nav { display: flex; gap: 20px; margin-top: 20px; }
a { color: #3c6750; text-underline-offset: 4px; }
section { margin: 0 0 40px; }
h2 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
.figure-scroll { overflow-x: auto; border: 1px solid #e1e4e2; border-radius: 20px; background: white; }
.figure-scroll:focus-visible { outline: 2px solid #3c6750; outline-offset: 4px; }
.figure-scroll > svg { display: block; width: 100%; min-width: 760px; height: auto; }
@media (max-width: 600px) { body { padding: 24px 16px; } h1 { font-size: 24px; } }
@media (prefers-color-scheme: dark) { body { background: #181b19; color: #ecefec; } header p { color: #adb7af; } a { color: #a7c9b4; } }
@media print { body { padding: 0; background: white; } nav, header { display: none; } section { break-after: page; } .figure-scroll { border: 0; } }
</style>
<style id="diagram-styles">
text { font-family: Inter, "Segoe UI", "Malgun Gothic", Arial, sans-serif; }
.canvas { fill: #ffffff; }
.card { fill: #ffffff; stroke: #e1e4e2; stroke-width: 1.5; }
.root-card { fill: #f7f8f7; stroke: #daddda; stroke-width: 1.5; }
.context-card { fill: #f7f8f7; stroke: #e1e4e2; stroke-width: 1.5; }
.accent-card { fill: #edf5f0; stroke: #c9dfd0; stroke-width: 1.5; }
.row { fill: #f7f8f7; }
.tag { fill: #e8f0eb; }
.eyebrow { fill: #737975; font-size: 15px; font-weight: 600; letter-spacing: 1px; }
.heading { fill: #202622; font-size: 27px; font-weight: 600; letter-spacing: -.5px; }
.label { fill: #202622; font-size: 23px; font-weight: 600; letter-spacing: -.3px; }
.body { fill: #646c66; font-size: 20px; }
.small { fill: #6c746e; font-size: 18px; }
.tag-text { fill: #3c6750; font-size: 16px; font-weight: 600; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
.connector { fill: none; stroke: #a1aaa4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.accent-line { fill: none; stroke: #7e9e89; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rule { stroke: #e0e4e1; stroke-width: 1.2; }
</style>
</head>
<body>
<main>
<header><h1>Azrael · Agent diagrams</h1><p>역할 분담과 대기·재개 · Roles, waiting and resuming</p><nav aria-label="Language"><a href="#agent-roles-ko-heading">한국어</a><a href="#agent-roles-en-heading">English</a></nav></header>
<section lang="ko" aria-labelledby="agent-roles-ko-heading"><h2 id="agent-roles-ko-heading">root와 subagent의 역할 분담</h2><div class="figure-scroll" tabindex="0" aria-label="root와 subagent의 역할 분담"><svg xmlns="http://www.w3.org/2000/svg" id="agent-roles-ko" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="agent-roles-ko-title agent-roles-ko-desc" lang="ko">
<title id="agent-roles-ko-title">root와 subagent의 역할 분담</title>
<desc id="agent-roles-ko-desc">사용자와 root가 설계를 논의합니다. root는 조사·구현 subagent에 위임하고 결과를 받습니다. architecture는 세션을 잇는 공통 설계입니다. lead는 추후 추가됩니다.</desc>
<defs><marker id="agent-roles-ko-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9ca69f"/></marker></defs>
<rect width="1120" height="640" rx="20" class="canvas"/>
<path d="M 398 104 V 168" class="connector" marker-end="url(#agent-roles-ko-arrow)" marker-start="url(#agent-roles-ko-arrow)"/>
<path d="M 748 257 H 816" class="connector" marker-end="url(#agent-roles-ko-arrow)" marker-start="url(#agent-roles-ko-arrow)"/>
<path d="M 398 346 V 382 H 214 V 432" class="connector" marker-end="url(#agent-roles-ko-arrow)" marker-start="url(#agent-roles-ko-arrow)"/>
<path d="M 398 382 H 582 V 432" class="connector" marker-end="url(#agent-roles-ko-arrow)"/>
<rect x="48" y="24" width="700" height="80" rx="18" class="card"/>
<text x="78" y="73" class="label" >사용자</text>
<text x="720" y="72" class="body" text-anchor="end">목표와 요구사항</text>
<text x="420" y="144" class="small" >논의 · 합의</text>
<rect x="48" y="168" width="700" height="178" rx="18" class="root-card"/>
<text x="78" y="207" class="eyebrow mono" >root</text>
<rect x="572" y="187" width="148" height="32" rx="16" class="tag"/>
<text x="646" y="209" class="tag-text" text-anchor="middle">시간 효율</text>
<text x="78" y="259" class="heading" >설계 논의와 작업 스케줄링</text>
<text x="78" y="300" class="body" >의존관계 정리 · 작업 배정 · 결과 통합</text>
<rect x="326" y="392" width="144" height="30" rx="15" class="canvas"/>
<text x="398" y="413" class="small" text-anchor="middle">위임 · 보고</text>
<rect x="48" y="432" width="332" height="140" rx="18" class="card"/>
<text x="76" y="466" class="eyebrow" >subagent · 토큰 효율</text>
<text x="76" y="511" class="label" >범위가 정해진 조사</text>
<text x="76" y="548" class="small" >핵심 근거를 짧게 인계</text>
<rect x="416" y="432" width="332" height="140" rx="18" class="card"/>
<text x="444" y="466" class="eyebrow" >subagent · 토큰 효율</text>
<text x="444" y="511" class="label" >구현과 검증</text>
<text x="444" y="548" class="small" >배정된 범위에 집중</text>
<rect x="816" y="168" width="256" height="404" rx="18" class="context-card"/>
<text x="844" y="209" class="eyebrow" >공통 맥락</text>
<text x="844" y="268" class="label mono" >architecture/</text>
<text x="844" y="306" class="body" >합의된 설계</text>
<line x1="844" y1="340" x2="1044" y2="340" class="rule"/>
<text x="844" y="385" class="body" >세션이 바뀌어도</text>
<text x="844" y="418" class="body" >이어지는 설계 기준</text>
<rect x="48" y="598" width="104" height="26" rx="13" class="row"/>
<text x="100" y="617" class="eyebrow" text-anchor="middle">추후 추가</text>
<text x="168" y="618" class="small" >lead · 사용자와의 설계 논의 전담</text>
</svg></div></section>
<section lang="ko" aria-labelledby="agent-resume-ko-heading"><h2 id="agent-resume-ko-heading">defer_root의 대기와 재개</h2><div class="figure-scroll" tabindex="0" aria-label="defer_root의 대기와 재개"><svg xmlns="http://www.w3.org/2000/svg" id="agent-resume-ko" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="agent-resume-ko-title agent-resume-ko-desc" lang="ko">
<title id="agent-resume-ko-title">defer_root의 대기와 재개</title>
<desc id="agent-resume-ko-desc">root는 작업을 배정한 뒤 defer_root로 기다립니다. 선택한 subagent와 외부 작업의 work_completion 결과가 모두 종료 상태가 되거나, 예약 시각·직접 재개·결정 요청에 의해 재개합니다. 재개 후 실제 결과를 확인합니다.</desc>
<defs><marker id="agent-resume-ko-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9ca69f"/></marker></defs>
<rect width="1120" height="640" rx="20" class="canvas"/>
<path d="M 328 98 H 392" class="connector" marker-end="url(#agent-resume-ko-arrow)"/>
<path d="M 552 156 V 224" class="connector" marker-end="url(#agent-resume-ko-arrow)"/>
<path d="M 1072 390 H 1096 V 98 H 1072" class="accent-line" marker-end="url(#agent-resume-ko-arrow)"/>
<rect x="48" y="40" width="280" height="116" rx="18" class="card"/>
<text x="76" y="72" class="eyebrow mono" >root</text>
<text x="76" y="110" class="heading" >작업 배정</text>
<text x="76" y="139" class="small" >독립 작업까지 수행</text>
<rect x="392" y="40" width="320" height="116" rx="18" class="root-card"/>
<text x="420" y="72" class="eyebrow mono" >root</text>
<text x="420" y="110" class="heading mono" >defer_root</text>
<text x="420" y="139" class="small" >모델 호출 없이 대기</text>
<rect x="784" y="40" width="288" height="116" rx="18" class="accent-card"/>
<text x="812" y="72" class="eyebrow mono" >root</text>
<text x="812" y="110" class="heading" >root 재개</text>
<text x="812" y="139" class="small" >결과 확인 · 통합 · 검증</text>
<rect x="48" y="224" width="1024" height="324" rx="18" class="card"/>
<text x="76" y="261" class="body" >다음 중 하나의 조건으로 재개</text>
<rect x="76" y="282" width="968" height="112" rx="12" class="row"/>
<text x="104" y="315" class="label" >선택한 작업 모두 종료</text>
<text x="104" y="346" class="small" >subagent 종료 + 외부 작업의 완료 플래그 기록</text>
<text x="104" y="376" class="small mono" >외부 작업 → work_completion</text>
<rect x="842" y="316" width="174" height="36" rx="18" class="tag"/>
<text x="929" y="340" class="tag-text mono" text-anchor="middle">all_terminal</text>
<rect x="76" y="406" width="968" height="56" rx="12" class="row"/>
<text x="104" y="442" class="label" >예약 시각 도달 · 직접 재개</text>
<text x="1016" y="441" class="small" text-anchor="end">시간 / 사용자</text>
<rect x="76" y="474" width="968" height="56" rx="12" class="row"/>
<text x="104" y="510" class="label" >subagent의 결정 요청</text>
<text x="1016" y="509" class="small mono" text-anchor="end">request_parent</text>
<circle cx="57" cy="592" r="5" fill="#8aa493"/>
<text x="76" y="599" class="small" >재개는 성공을 뜻하지 않습니다. 실제 종료 결과를 확인합니다.</text>
</svg></div></section>
<section lang="en" aria-labelledby="agent-roles-en-heading"><h2 id="agent-roles-en-heading">How root and subagents divide the work</h2><div class="figure-scroll" tabindex="0" aria-label="How root and subagents divide the work"><svg xmlns="http://www.w3.org/2000/svg" id="agent-roles-en" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="agent-roles-en-title agent-roles-en-desc" lang="en">
<title id="agent-roles-en-title">How root and subagents divide the work</title>
<desc id="agent-roles-en-desc">The user and root discuss design. Root assigns bounded research and implementation to subagents and receives their results. Architecture carries shared design across sessions. A dedicated lead is planned.</desc>
<defs><marker id="agent-roles-en-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9ca69f"/></marker></defs>
<rect width="1120" height="640" rx="20" class="canvas"/>
<path d="M 398 104 V 168" class="connector" marker-end="url(#agent-roles-en-arrow)" marker-start="url(#agent-roles-en-arrow)"/>
<path d="M 748 257 H 816" class="connector" marker-end="url(#agent-roles-en-arrow)" marker-start="url(#agent-roles-en-arrow)"/>
<path d="M 398 346 V 382 H 214 V 432" class="connector" marker-end="url(#agent-roles-en-arrow)" marker-start="url(#agent-roles-en-arrow)"/>
<path d="M 398 382 H 582 V 432" class="connector" marker-end="url(#agent-roles-en-arrow)"/>
<rect x="48" y="24" width="700" height="80" rx="18" class="card"/>
<text x="78" y="73" class="label" >User</text>
<text x="720" y="72" class="body" text-anchor="end">Goals &amp; requirements</text>
<text x="420" y="144" class="small" >Discuss · Agree</text>
<rect x="48" y="168" width="700" height="178" rx="18" class="root-card"/>
<text x="78" y="207" class="eyebrow mono" >root</text>
<rect x="572" y="187" width="148" height="32" rx="16" class="tag"/>
<text x="646" y="209" class="tag-text" text-anchor="middle">Time efficiency</text>
<text x="78" y="259" class="heading" >Design &amp; scheduling</text>
<text x="78" y="300" class="body" >Dependencies · Assignment · Integration</text>
<rect x="326" y="392" width="144" height="30" rx="15" class="canvas"/>
<text x="398" y="413" class="small" text-anchor="middle">Assign · Report</text>
<rect x="48" y="432" width="332" height="140" rx="18" class="card"/>
<text x="76" y="466" class="eyebrow" >subagent · Token efficiency</text>
<text x="76" y="511" class="label" >Focused research</text>
<text x="76" y="548" class="small" >A concise evidence handoff</text>
<rect x="416" y="432" width="332" height="140" rx="18" class="card"/>
<text x="444" y="466" class="eyebrow" >subagent · Token efficiency</text>
<text x="444" y="511" class="label" >Build &amp; verify</text>
<text x="444" y="548" class="small" >One bounded assignment</text>
<rect x="816" y="168" width="256" height="404" rx="18" class="context-card"/>
<text x="844" y="209" class="eyebrow" >SHARED CONTEXT</text>
<text x="844" y="268" class="label mono" >architecture/</text>
<text x="844" y="306" class="body" >Agreed design</text>
<line x1="844" y1="340" x2="1044" y2="340" class="rule"/>
<text x="844" y="385" class="body" >A shared reference</text>
<text x="844" y="418" class="body" >across sessions</text>
<rect x="48" y="598" width="104" height="26" rx="13" class="row"/>
<text x="100" y="617" class="eyebrow" text-anchor="middle">PLANNED</text>
<text x="168" y="618" class="small" >lead · Dedicated design discussion with the user</text>
</svg></div></section>
<section lang="en" aria-labelledby="agent-resume-en-heading"><h2 id="agent-resume-en-heading">How defer_root waits and resumes</h2><div class="figure-scroll" tabindex="0" aria-label="How defer_root waits and resumes"><svg xmlns="http://www.w3.org/2000/svg" id="agent-resume-en" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="agent-resume-en-title agent-resume-en-desc" lang="en">
<title id="agent-resume-en-title">How defer_root waits and resumes</title>
<desc id="agent-resume-en-desc">Root assigns work, then parks with defer_root. It resumes when selected subagents and external work_completion records are all terminal, at the scheduled time, on manual resume or for a decision request. Actual results are checked after resuming.</desc>
<defs><marker id="agent-resume-en-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9ca69f"/></marker></defs>
<rect width="1120" height="640" rx="20" class="canvas"/>
<path d="M 328 98 H 392" class="connector" marker-end="url(#agent-resume-en-arrow)"/>
<path d="M 552 156 V 224" class="connector" marker-end="url(#agent-resume-en-arrow)"/>
<path d="M 1072 390 H 1096 V 98 H 1072" class="accent-line" marker-end="url(#agent-resume-en-arrow)"/>
<rect x="48" y="40" width="280" height="116" rx="18" class="card"/>
<text x="76" y="72" class="eyebrow mono" >root</text>
<text x="76" y="110" class="heading" >Assign work</text>
<text x="76" y="139" class="small" >Finish independent work</text>
<rect x="392" y="40" width="320" height="116" rx="18" class="root-card"/>
<text x="420" y="72" class="eyebrow mono" >root</text>
<text x="420" y="110" class="heading mono" >defer_root</text>
<text x="420" y="139" class="small" >Wait without model calls</text>
<rect x="784" y="40" width="288" height="116" rx="18" class="accent-card"/>
<text x="812" y="72" class="eyebrow mono" >root</text>
<text x="812" y="110" class="heading" >Root resumes</text>
<text x="812" y="139" class="small" >Inspect · Integrate · Verify</text>
<rect x="48" y="224" width="1024" height="324" rx="18" class="card"/>
<text x="76" y="261" class="body" >Resume when any condition is met</text>
<rect x="76" y="282" width="968" height="112" rx="12" class="row"/>
<text x="104" y="315" class="label" >All selected work terminates</text>
<text x="104" y="346" class="small" >Subagents terminate + external jobs record completion</text>
<text x="104" y="376" class="small mono" >External job → work_completion</text>
<rect x="842" y="316" width="174" height="36" rx="18" class="tag"/>
<text x="929" y="340" class="tag-text mono" text-anchor="middle">all_terminal</text>
<rect x="76" y="406" width="968" height="56" rx="12" class="row"/>
<text x="104" y="442" class="label" >Scheduled time · Resume now</text>
<text x="1016" y="441" class="small" text-anchor="end">Time / User</text>
<rect x="76" y="474" width="968" height="56" rx="12" class="row"/>
<text x="104" y="510" class="label" >A subagent requests a decision</text>
<text x="1016" y="509" class="small mono" text-anchor="end">request_parent</text>
<circle cx="57" cy="592" r="5" fill="#8aa493"/>
<text x="76" y="599" class="small" >Resuming does not establish success. Check the actual terminal results.</text>
</svg></div></section>
</main>
