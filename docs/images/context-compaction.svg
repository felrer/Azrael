<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>
  <title>Context usage and queued compaction</title>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#202123" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="30" y="30" width="500" height="354" rx="18" fill="#ffffff" stroke="#e6e6e8" filter="url(#shadow)"/>
  <text x="54" y="68" font-size="15" fill="#202123">Context usage</text>
  <g font-size="12" fill="#66676b">
    <text x="54" y="112">Auto-compaction basis</text>
    <text x="454" y="112" text-anchor="end" font-family="Consolas, monospace" fill="#202123">247,263 / 600,000</text>
    <text x="506" y="112" text-anchor="end" fill="#202123">41.2%</text>
    <rect x="54" y="127" width="452" height="6" rx="3" fill="#ececee"/>
    <rect x="54" y="127" width="186.224" height="6" rx="3" fill="#252526"/>
    <text x="54" y="176">Full capacity basis</text>
    <text x="454" y="176" text-anchor="end" font-family="Consolas, monospace" fill="#202123">247,263 / 1,000,000</text>
    <text x="506" y="176" text-anchor="end" fill="#202123">24.7%</text>
    <rect x="54" y="191" width="452" height="6" rx="3" fill="#ececee"/>
    <rect x="54" y="191" width="111.644" height="6" rx="3" fill="#252526"/>
    <text x="54" y="245">Model</text>
    <text x="506" y="245" text-anchor="end" font-family="Consolas, monospace" fill="#202123">managed/anthropic/claude-opus-5</text>
  </g>
  <rect x="54" y="278" width="150" height="34" rx="10" fill="#252526"/>
  <text x="129" y="300" text-anchor="middle" font-size="13" fill="#ffffff">Compact context</text>
  <text x="54" y="342" font-size="11" fill="#77787b">Queued with your next message. Skipped if usage is under 15%.</text>
</svg>
