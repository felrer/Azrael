<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Azrael 제품 데모 영상 준비 중</title>
  <desc id="desc">앞으로 제품 소개 영상을 배치할 자리입니다. 현재 재생 가능한 영상이나 링크는 없습니다.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#101a20"/></linearGradient>
    <radialGradient id="blue"><stop stop-color="#5587d2" stop-opacity=".26"/><stop offset="1" stop-color="#5587d2" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop stop-color="#52ae9b" stop-opacity=".18"/><stop offset="1" stop-color="#52ae9b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d7e1ef" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="673" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="675" fill="url(#surface)"/>
    <ellipse cx="290" cy="230" rx="490" ry="430" fill="url(#blue)"/>
    <ellipse cx="1000" cy="550" rx="490" ry="410" fill="url(#green)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>
    <g fill="none" stroke="#cad7e9" stroke-opacity=".07">
      <circle cx="600" cy="288" r="148"/><circle cx="600" cy="288" r="228"/>
      <path d="M0 288H350M850 288H1200"/>
    </g>
    <g font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
      <text x="48" y="57" fill="#d7e3f1" font-size="17" font-weight="600" letter-spacing="3">AZRAEL / PRODUCT TOUR</text>
      <rect x="1000" y="33" width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="1075" y="57" fill="#b5c3d3" font-size="13" text-anchor="middle" letter-spacing="1.2">COMING SOON</text>
      <circle cx="600" cy="270" r="61" fill="#ffffff" fill-opacity=".07" stroke="#dbe7f7" stroke-opacity=".28"/>
      <path d="M587 247L624 270L587 293Z" fill="#e7eff9"/>
      <text x="600" y="401" text-anchor="middle" fill="#f4f7fc" font-size="44" font-weight="600" letter-spacing="-1.5">한 번의 요청, 이어지는 작업.</text>
      <text x="600" y="448" text-anchor="middle" fill="#b0bfd0" font-size="23">제품 데모 영상 · 준비 중</text>
      <path d="M48 593H1152" stroke="#c4d2e5" stroke-opacity=".12"/>
      <text x="48" y="632" fill="#8d9db1" font-size="16">생각을 정리하고, 작업을 나누고, 결과를 완성합니다.</text>
      <text x="1152" y="632" text-anchor="end" fill="#8d9db1" font-size="16">AI WORKSPACE</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="673" rx="28" fill="none" stroke="#293647"/>
</svg>
