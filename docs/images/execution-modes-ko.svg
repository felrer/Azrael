<?xml version="1.0" encoding="UTF-8"?>
<svg id="execution-modes-ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" role="img" aria-labelledby="modes-title modes-desc">
<style>
  text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #202522; }
  .canvas { fill: #fafbf9; }
  .title { font-size: 34px; font-weight: 700; letter-spacing: -1.2px; }
  .subtitle { font-size: 18px; fill: #616963; }
  .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #66726a; }
  .h { font-size: 24px; font-weight: 650; letter-spacing: -.6px; }
  .body { font-size: 19px; }
  .small { font-size: 16px; fill: #616963; }
  .label { font-size: 16px; font-weight: 650; }
  .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 17px; }
  .paper { fill: #fff; stroke: #dce1db; stroke-width: 1.5; }
  .soft { fill: #f0f2ee; }
  .blue { fill: #edf3fc; stroke: #c3d5ee; stroke-width: 1.5; }
  .green { fill: #eaf4ee; stroke: #bfd8c8; stroke-width: 1.5; }
  .purple { fill: #f1edf8; stroke: #d4c9e8; stroke-width: 1.5; }
  .blue-ink { fill: #315d94; }
  .green-ink { fill: #326a4b; }
  .purple-ink { fill: #6b508e; }
  .rule { stroke: #dce1db; stroke-width: 1.5; }
  .line { fill: none; stroke: #7d8981; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 6; }
  .number { font-size: 15px; font-weight: 700; fill: #fff; }
  .dot { fill: #53685a; }
</style>
<title id="modes-title">Direct와 개발 중인 Team의 실행 역할</title>
<desc id="modes-desc">권장 Direct는 사용자가 Root와 대화하고 Root가 하위 에이전트에 일을 맡기는 구조다. 개발 중인 Team은 사용자가 Lead와 대화하고 Lead 아래 여러 Root가 각자의 하위 에이전트를 갖는 구조다. 두 구조는 저장된 역할 Profile 라이브러리를 공유한다.</desc>
<defs><marker id="modes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7d8981" stroke-width="1.5"/></marker></defs>
<rect class="canvas" width="1120" height="820" rx="20"/>
<text class="eyebrow" x="48" y="48">02 / EXECUTION MODES</text>
<text class="title" x="48" y="94">대화 창구와 실행 책임의 구조</text>
<text class="subtitle" x="48" y="129">Direct를 기본으로 시작하고, Team의 개발 상태를 구분합니다.</text>
