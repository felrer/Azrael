[package]
name = "azrael-window-control"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
windows = { version = "=0.58.0", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_Com", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"
] }
